<div class="marquee" id="cardsMarquee">
  <div class="cards-track">
    <div class="set set-a">
      {% for card in site.data.cards.items %}
        <div class="mcard">
          <div class="mcard-media">
            <img src="{{ card.image | relative_url }}" alt="{{ card.title }}">
          </div>
          <div class="mcard-body">
            <div class="mcard-title">{{ card.title }}</div>
            <div class="mcard-text">{{ card.text }}</div>
          </div>
          <a href="{{ card.link }}" target="_blank" rel="noopener" class="mcard-link"></a>
        </div>
      {% endfor %}
    </div>
    
    <div class="set set-b" aria-hidden="true">
      {% for card in site.data.cards.items %}
        <div class="mcard">
          <div class="mcard-media">
            <img src="{{ card.image | relative_url }}" alt="{{ card.title }}">
          </div>
          <div class="mcard-body">
            <div class="mcard-title">{{ card.title }}</div>
            <div class="mcard-text">{{ card.text }}</div>
          </div>
          <a href="{{ card.link }}" target="_blank" rel="noopener" class="mcard-link"></a>
        </div>
      {% endfor %}
    </div>
  </div>
</div>

<script>
document.addEventListener('DOMContentLoaded', function() {
  const track = document.querySelector('.cards-track');
  const setA = document.querySelector('.set-a');
  
  if (track && setA) {
    // sikker spacing: mål inkl. marginer
    const width = Math.round(setA.getBoundingClientRect().width);
    track.style.setProperty('--shift', `-${width}px`);
  }
});
</script>
